<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>كويز نهاية الحصة | قابلية القسمة</title>
  <style>
    :root{
      --bg1:#071a33;
      --bg2:#2a1636;
      --accent:#f4b6c2;
      --accent2:#f6d27a;
      --button:#ff6f61;
      --button2:#f59e0b;
      --text:#f8fafc;
      --muted:#f1d7dc;
      --line:rgba(255,255,255,.16);
      --good:#22c55e;
      --bad:#ef4444;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      font-family:Tahoma, Arial, sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 12% 4%, rgba(246,210,122,.22), transparent 24rem),
        radial-gradient(circle at 86% 10%, rgba(244,182,194,.22), transparent 22rem),
        linear-gradient(135deg,var(--bg1),var(--bg2));
    }
    .wrap{width:min(980px,94vw);margin:auto;padding:28px 0}
    .hero{min-height:88vh;display:grid;place-items:center}
    .ticket,.card{
      border:1px solid var(--line);
      border-radius:18px;
      background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.035));
      box-shadow:0 20px 60px rgba(0,0,0,.28);
      backdrop-filter:blur(12px);
    }
    .ticket{width:min(760px,100%);padding:34px;overflow:hidden;position:relative}
    .label{
      display:inline-flex;
      padding:8px 13px;
      border-radius:999px;
      border:1px solid rgba(246,210,122,.42);
      color:var(--accent2);
      background:rgba(0,0,0,.18);
      font-size:14px;
    }
    h1{margin:20px 0 10px;font-size:clamp(34px,6vw,58px);line-height:1.15}
    .subtitle{color:var(--muted);font-size:18px;line-height:1.8;margin:0 0 26px}
    .level-track{display:grid;gap:12px;margin:22px 0 26px}
    .level-row{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:center;color:var(--muted)}
    .level-row strong{color:var(--accent2)}
    .meter{height:12px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;border:1px solid rgba(255,255,255,.1)}
    .meter span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--button2))}
    button{
      border:0;
      border-radius:14px;
      min-height:48px;
      padding:0 22px;
      color:white;
      background:linear-gradient(135deg,var(--button),var(--button2));
      box-shadow:0 14px 28px rgba(255,111,97,.25);
      font-family:inherit;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
    }
    .ghost{background:rgba(255,255,255,.1);border:1px solid var(--line);box-shadow:none}
    .quiz,.result{display:none}
    .topbar{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:18px}
    .pill{border:1px solid rgba(246,210,122,.34);background:rgba(255,255,255,.08);border-radius:999px;padding:9px 13px;color:var(--accent2);font-size:14px}
    .progress{height:9px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-bottom:18px}
    .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--button2));transition:.25s}
    .card{padding:24px}
    .q{font-size:26px;line-height:1.8;margin:0 0 18px;text-align:center;color:#fff;direction:ltr;unicode-bidi:embed}
    .choices{display:grid;gap:12px}
    .choice{
      width:100%;
      border:1px solid rgba(255,255,255,.18);
      border-radius:16px;
      padding:15px 16px;
      color:var(--text);
      background:rgba(255,255,255,.09);
      font-size:21px;
      text-align:center;
      direction:ltr;
      unicode-bidi:embed;
      box-shadow:none;
    }
    .choice:hover,.choice.selected{border-color:var(--accent2);background:rgba(246,210,122,.16)}
    .actions{display:flex;justify-content:space-between;gap:12px;margin-top:18px}
    .dots{display:flex;flex-wrap:wrap;gap:7px;margin:18px 0 0;justify-content:center}
    .dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.24)}
    .dot.done{background:var(--accent2)}
    .score{font-size:44px;color:var(--accent2);margin:8px 0;font-weight:800}
    .review{margin-top:18px;display:grid;gap:12px}
    .review-item{border:1px solid var(--line);border-radius:14px;padding:14px;background:rgba(255,255,255,.07);line-height:1.8}
    .math-text{direction:ltr;unicode-bidi:embed;display:inline-block}
    .ok{color:var(--good);font-weight:700}
    .no{color:var(--bad);font-weight:700}
    @media (max-width:640px){
      .ticket{padding:26px 22px}
      .topbar,.actions{flex-direction:column;align-items:stretch}
      .q{font-size:22px}
      .level-row{grid-template-columns:76px 1fr}
    }
  </style>
  <style>
    .teacher-name{margin:0 0 20px;text-align:center;color:var(--accent2);font-size:clamp(20px,4vw,26px);font-weight:700;line-height:1.6}
    math{font-weight:normal}
    .score{direction:ltr;unicode-bidi:isolate}
    @media(max-width:640px){.q{font-size:22px}.q math{font-size:1.15em}}
    @media(max-width:360px){.q math{font-size:1em}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero" id="start">
      <div class="ticket">
        <p class="teacher-name">أ. حذيفه الضامن</p>
        <span class="label">قدرات الرياضيات | ارفع مستوى فهمك</span>
        <h1>كويز نهاية الحصة</h1>
        <p class="subtitle">خطوة صغيرة بعد الحصة تصنع فرقًا كبيرًا في الإتقان. ركّز، اختر بثقة، وأثبت لنفسك أنك قادر.</p>
        <div class="level-track">
          <div class="level-row"><strong>الفهم</strong><div class="meter"><span style="width:82%"></span></div></div>
          <div class="level-row"><strong>التطبيق</strong><div class="meter"><span style="width:66%"></span></div></div>
          <div class="level-row"><strong>الإتقان</strong><div class="meter"><span style="width:48%"></span></div></div>
        </div>
        <button onclick="startQuiz()">اختبر مستواك</button>
      </div>
    </section>

    <section class="quiz" id="quiz">
      <div class="topbar">
        <div class="pill" id="counter"></div>
        <div class="pill">بدون وقت</div>
      </div>
      <div class="progress"><div class="bar" id="bar"></div></div>
      <div class="card">
        <p class="q" id="question"></p>
        <div class="choices" id="choices"></div>
        <div class="dots" id="dots"></div>
        <div class="actions">
          <button class="ghost" onclick="prevQuestion()">السابق</button>
          <button id="nextBtn" onclick="nextQuestion()">التالي</button>
        </div>
      </div>
    </section>

    <section class="result" id="result">
      <div class="card">
        <span class="label">تم اعتماد الكويز</span>
        <h1>تم اعتماد الكويز</h1>
        <div class="score" id="score"></div>
        <p class="subtitle" id="message"></p>
        <div class="review" id="review"></div>
        <div class="actions">
          <button class="ghost" onclick="location.reload()">إعادة التجربة</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const questions = [
      { text: "أي عدد مما يلي يقبل القسمة على ٢؟", choices: ["135", "247", "476", "583"], answer: 2 },
      { text: "أي عدد مما يلي يقبل القسمة على ٣؟", choices: ["381", "124", "502", "715"], answer: 0 },
      { text: "أي عدد مما يلي يقبل القسمة على ٥؟", choices: ["10073", "4130", "247", "582"], answer: 1 },
      { text: "أي الأعداد التالية زوجي؟", choices: ["10073", "4130", "5917", "8271"], answer: 1 },
      { text: "660 ÷ 6 =", choices: ["100", "106", "110", "116"], answer: 2 },
      { text: "16.8 ÷ 1.2 =", choices: ["12", "14", "16", "18"], answer: 1 },
      { text: "70 ÷ 5 =", choices: ["12", "13", "14", "15"], answer: 2 },
      { text: "33.7 ÷ 10 =", choices: ["337", "33.7", "3.37", "0.337"], answer: 2 },
      { text: "3.5 ÷ 100 =", choices: ["0.35", "0.035", "35", "350"], answer: 1 }
    ];

    let current = 0;
    const answers = Array(questions.length).fill(null);

    function startQuiz(){
      document.getElementById("start").style.display = "none";
      document.getElementById("quiz").style.display = "block";
      renderQuestion();
    }

    function renderPlainQuestion(text){
      const safe=text.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
      return `<bdi dir="${/^[\d .+\-×÷=()]+$/.test(text) ? "ltr" : "rtl"}">${safe}</bdi>`;
    }
    function renderQuestion(){
      const item = questions[current];
      document.getElementById("counter").textContent = `السؤال ${current + 1} من ${questions.length}`;
      document.getElementById("bar").style.width = `${((current + 1) / questions.length) * 100}%`;
      document.getElementById("question").innerHTML = renderPlainQuestion(item.text);
      document.getElementById("choices").innerHTML = item.choices.map((choice, index) =>
        `<button class="choice ${answers[current] === index ? "selected" : ""}" onclick="selectAnswer(${index})">${choice}</button>`
      ).join("");
      document.getElementById("dots").innerHTML = questions.map((_, index) =>
        `<span class="dot ${answers[index] !== null ? "done" : ""}"></span>`
      ).join("");
      document.getElementById("nextBtn").textContent = current === questions.length - 1 ? "تسليم الكويز" : "التالي";
    }

    function selectAnswer(index){
      answers[current] = index;
      renderQuestion();
    }

    function prevQuestion(){
      if(current > 0){
        current--;
        renderQuestion();
      }
    }

    function nextQuestion(){
      if(current < questions.length - 1){
        current++;
        renderQuestion();
      }else{
        submitQuiz();
      }
    }

    function submitQuiz(){
      let correct = 0;
      questions.forEach((q, i) => {
        if(answers[i] === q.answer) correct++;
      });
      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("score").textContent = `${correct} / ${questions.length}`;
      document.getElementById("message").textContent =
        correct === questions.length ? "ممتاز، وصلت لمستوى الإتقان." :
        correct >= Math.ceil(questions.length / 2) ? "جيد جدًا، راجع الأخطاء البسيطة وثبّت القاعدة." :
        "لا بأس، راجع قواعد القسمة ثم أعد المحاولة.";
      document.getElementById("review").innerHTML = questions.map((q, i) => {
        const isCorrect = answers[i] === q.answer;
        const studentAnswer = answers[i] === null ? "غير مجاب" : q.choices[answers[i]];
        return `
          <div class="review-item">
            <strong>السؤال ${i + 1}</strong><br>
            <span class="math-text">${renderPlainQuestion(q.text)}</span><br>
            إجابتك: <span class="${isCorrect ? "ok" : "no"} math-text">${studentAnswer}</span><br>
            الإجابة الصحيحة: <span class="ok math-text">${q.choices[q.answer]}</span>
          </div>
        `;
      }).join("");
    }
  </script>
</body>
</html>
